# push / PR で型チェックとテストを走らせる
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # テストは .ts を型ストリップで直接実行するので Node 22.18+ が要る
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # PDF のテストは Chrome が無い環境では自動でスキップされる
      - run: npm test
